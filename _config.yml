title: Meher Bhaskar
tagline: Notes on agentic AI that survives production.
description: "Practitioner notes on building agentic AI that survives production: evals, multi-agent systems, LLM benchmarking, and the engineering in between. By Meher Bhaskar Madiraju."
url: "https://meherbhaskar.github.io"
baseurl: ""

author:
  name: Meher Bhaskar Madiraju
  short_name: Meher Bhaskar
  email: meherbhaskar.madiraju@gmail.com
  github: MeherBhaskar
  linkedin: meherbhaskar
  medium: meherbhaskar
  scholar: https://scholar.google.com/citations?hl=en&user=FxAZvUIAAAAJ
  orcid: 0009-0002-1454-0668
  website: https://meherbhaskar.github.io

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

permalink: /:year/:month/:day/:title/
excerpt_separator: <!--more-->

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Meher Bhaskar"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - site-build-notes.md
