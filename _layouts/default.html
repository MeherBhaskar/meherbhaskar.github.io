<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>
  <main class="wrapper">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ site.time | date: '%Y' }} Meher Bhaskar Madiraju</p>
      <p class="social">
        <a href="https://github.com/{{ site.author.github }}">GitHub</a> &middot;
        <a href="https://linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a> &middot;
        <a href="https://{{ site.author.medium }}.medium.com">Medium</a> &middot;
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
